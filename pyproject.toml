[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "hydrogen-team"
version = "0.1.0"
description = "Open-source multi-agent collaboration studio powered by Google Gemini 4 Hydrogen & Google ADK."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
  { name = "Hydrogen Team Contributors" }
]
keywords = [
  "google-adk",
  "gemini-4-hydrogen",
  "gemini-4",
  "multi-agent",
  "vertex-ai",
  "ai-agents",
  "collaboration",
  "motion-graphics",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "google-adk>=2.15.0",
  "google-genai>=2.30.0",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "sse-starlette>=2.2.0",
  "pydantic>=2.10.0",
  "pydantic-settings>=2.7.0",
  "typer>=0.15.0",
  "rich>=13.9.0",
  "pillow>=11.0.0",
  "httpx>=0.28.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.9.0",
]

[project.scripts]
hydrogen-team = "hydrogen_team.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrogen_team"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "live: marks tests that make live Vertex AI / Gemini API calls",
]
